site_name: Fayolex BUMN Pipeline
site_description: Sales Intelligence — Peluang LMS di BUMN Indonesia
site_url: https://fentonmartin.github.io/fayolex-bumn-pipeline
repo_url: https://github.com/fentonmartin/fayolex-bumn-pipeline

theme:
  name: material
  language: id
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Mode Gelap
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Mode Terang
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - search.share
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: id
  - tags

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tasklist

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fentonmartin

copyright: "© 2026 Fayolex Learning Experience · Internal Use Only"

